<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'" />
  <title>LiveClass menu</title>
  <link rel="stylesheet" href="theme.css" />
  <style>
    /* The whole overlay is transparent; only the panel paints. Clicking outside it closes the menu. */
    html, body { background: transparent; }
    .backdrop { position: fixed; inset: 0; }

    .panel {
      position: fixed;
      width: 304px;
      max-height: calc(100vh - var(--top, 44px) - 12px);
      overflow-y: auto;
      padding: 6px;
      border-radius: 12px;
      background: var(--panel);
      border: 1px solid var(--panel-line);
      box-shadow: var(--shadow);
      transform-origin: top right;
      opacity: 0;
      transform: translateY(-6px) scale(0.98);
      transition: opacity 0.12s ease-out, transform 0.14s cubic-bezier(0.2, 0.8, 0.2, 1);
      outline: none;
    }
    .panel.show { opacity: 1; transform: none; }
    .panel::-webkit-scrollbar { width: 0; }

    /* --- Student join card ------------------------------------------------------------------ */
    .join {
      padding: 12px 12px 10px;
      margin-bottom: 4px;
      border-radius: 9px;
      background: var(--ok-bg);
      border: 1px solid var(--ok-line);
    }
    .join-head { display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: 11.5px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 3px var(--ok-bg); }
    .join-url {
      margin: 8px 0 10px;
      font-size: 19px;
      font-weight: 650;
      letter-spacing: 0.01em;
      font-variant-numeric: tabular-nums;
      user-select: text;
      line-height: 1.15;
      word-break: break-all;
    }
    .join-actions { display: flex; gap: 6px; }
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 28px;
      padding: 0 10px;
      border-radius: 7px;
      border: 1px solid var(--panel-line);
      background: var(--panel);
      cursor: default;
      transition: background-color 0.1s, border-color 0.1s;
    }
    .chip:hover, .chip:focus-visible { background: var(--hover); }
    .chip[aria-expanded="true"] { background: var(--press); }
    .chip svg { width: 14px; height: 14px; color: var(--muted); }
    .chip.done { color: var(--ok); border-color: var(--ok-line); }
    .chip.done svg { color: var(--ok); }

    .qr { margin-top: 10px; display: grid; justify-items: center; gap: 8px; }
    .qr[hidden] { display: none; }
    .qr-box { padding: 10px; border-radius: 10px; background: #fff; line-height: 0; }
    .qr-box svg { width: 176px; height: 176px; display: block; }
    .qr p { margin: 0; color: var(--muted); font-size: 11.5px; line-height: 1.4; text-align: center; }

    .join.offline { background: var(--warn-bg); border-color: var(--warn-line); }
    .join.offline .dot { background: var(--warn); box-shadow: 0 0 0 3px var(--warn-bg); }
    .join.offline .join-url { font-size: 15px; margin-bottom: 4px; }
    .offline-hint { margin: 0; color: var(--muted); font-size: 11.5px; line-height: 1.45; }

    /* --- Menu rows --------------------------------------------------------------------------- */
    .sep { height: 1px; background: var(--line); margin: 5px 4px; }
    .section { padding: 8px 10px 4px; color: var(--muted); font-size: 11px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; }

    .row {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 10px;
      height: 34px;
      padding: 0 10px;
      border: 0;
      border-radius: 7px;
      background: transparent;
      text-align: left;
      cursor: default;
      outline: none;
    }
    button.row:hover, button.row:focus-visible { background: var(--hover); }
    button.row:active { background: var(--press); }
    .row > svg { width: 16px; height: 16px; flex-shrink: 0; color: var(--muted); }
    .row .label { flex: 1; }
    .row kbd, .row .meta { font: 11px var(--font); color: var(--muted); }
    .row.danger { color: var(--danger); }
    .row.danger > svg { color: var(--danger); }
    .row.danger:hover, .row.danger:focus-visible { background: var(--danger-bg); }

    .stepper {
      display: flex;
      align-items: center;
      height: 26px;
      border-radius: 7px;
      border: 1px solid var(--panel-line);
      overflow: hidden;
    }
    .stepper button {
      height: 100%;
      border: 0;
      background: transparent;
      cursor: default;
      outline: none;
      display: grid;
      place-items: center;
    }
    .stepper .step { width: 28px; color: var(--muted); }
    .stepper .step svg { width: 14px; height: 14px; }
    .stepper .pct { min-width: 50px; font-variant-numeric: tabular-nums; border-inline: 1px solid var(--panel-line); }
    .stepper button:hover, .stepper button:focus-visible { background: var(--hover); color: var(--text); }
    .stepper button:active { background: var(--press); }
  </style>
</head>
<body>
  <div class="backdrop" id="backdrop"></div>
  <div class="panel" id="panel" role="menu" aria-label="LiveClass menu" tabindex="-1">
    <section class="join" id="join">
      <div class="join-head"><span class="dot"></span><span id="join-label">Students join at</span></div>
      <div class="join-url" id="join-url"></div>
      <p class="offline-hint" id="offline-hint" hidden>Connect this computer to Wi-Fi, or turn on its mobile hotspot, so students can join.</p>
      <div class="join-actions" id="join-actions">
        <button class="chip item" id="copy" role="menuitem">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" /><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" /></svg>
          <span id="copy-label">Copy address</span>
        </button>
        <button class="chip item" id="qr-toggle" role="menuitem" aria-expanded="false" aria-controls="qr">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1" /><rect x="14" y="3" width="7" height="7" rx="1" /><rect x="3" y="14" width="7" height="7" rx="1" /><path d="M14 14h3v3h-3zM20 14v.01M14 20h.01M17 20h4v-3" /></svg>
          <span>QR code</span>
        </button>
      </div>
      <div class="qr" id="qr" hidden>
        <div class="qr-box" id="qr-svg"></div>
        <p>Students scan this with their phone camera.</p>
      </div>
    </section>

    <div class="section">View</div>
    <button class="row item" role="menuitem" data-action="full-screen">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3" /></svg>
      <span class="label" id="full-screen-label">Full screen</span><kbd>F11</kbd>
    </button>
    <div class="row">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8" /><path d="m21 21-4.3-4.3M11 8v6M8 11h6" /></svg>
      <span class="label">Zoom</span>
      <div class="stepper">
        <button class="step item" role="menuitem" data-action="zoom-out" aria-label="Zoom out" title="Zoom out (Ctrl+-)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 12h14" /></svg>
        </button>
        <button class="pct item" role="menuitem" data-action="zoom-reset" id="zoom" title="Reset to 100% (Ctrl+0)">100%</button>
        <button class="step item" role="menuitem" data-action="zoom-in" aria-label="Zoom in" title="Zoom in (Ctrl+=)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 12h14M12 5v14" /></svg>
        </button>
      </div>
    </div>
    <button class="row item" role="menuitem" data-action="reload">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36L21 8" /><path d="M21 3v5h-5" /></svg>
      <span class="label">Reload</span><kbd>Ctrl+R</kbd>
    </button>

    <div class="sep"></div>
    <div class="section">Help</div>
    <button class="row item" role="menuitem" data-action="help">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2zM22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z" /></svg>
      <span class="label">Help &amp; guides</span><kbd>F1</kbd>
    </button>
    <button class="row item" role="menuitem" data-action="data-folder">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z" /></svg>
      <span class="label">Open data folder</span>
    </button>
    <button class="row item" role="menuitem" data-action="server-log">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z" /><path d="M14 2v4a2 2 0 0 0 2 2h4M16 13H8M16 17H8M10 9H8" /></svg>
      <span class="label">Server log</span>
    </button>
    <button class="row item" role="menuitem" data-action="dev-tools">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m16 18 6-6-6-6M8 6l-6 6 6 6" /></svg>
      <span class="label">Developer tools</span><kbd>Ctrl+Shift+I</kbd>
    </button>
    <button class="row item" role="menuitem" data-action="about">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10" /><path d="M12 16v-4M12 8h.01" /></svg>
      <span class="label">About LiveClass</span><span class="meta" id="version"></span>
    </button>

    <div class="sep"></div>
    <button class="row item danger" role="menuitem" data-action="quit">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v10" /><path d="M18.4 6.6a9 9 0 1 1-12.77.04" /></svg>
      <span class="label">Quit LiveClass</span>
    </button>
  </div>

  <script src="menu.js"></script>
</body>
</html>
