<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'" />
  <title>LiveClass</title>
  <link rel="stylesheet" href="theme.css" />
  <style>
    :root { --h: 40px; }
    html, body { background: var(--bg); }
    button { -webkit-app-region: no-drag; }

    /* Full-width strip behind the window controls, so the bar's colour and hairline run edge to edge. */
    .bar-bg {
      position: fixed;
      inset: 0 0 auto 0;
      height: var(--h);
      background: var(--bar);
      border-bottom: 1px solid var(--line);
      transition: background-color 0.2s;
    }

    .bar {
      position: fixed;
      top: 0;
      left: env(titlebar-area-x, 0);
      width: env(titlebar-area-width, calc(100% - 138px));
      height: var(--h);
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 0 6px 1px 12px;
      -webkit-app-region: drag;
    }
    .bar > * { flex-shrink: 0; }

    .brand { display: flex; align-items: center; padding: 0 2px; }
    .brand img { width: 18px; height: 18px; display: block; }

    .icon-btn {
      width: 30px;
      height: 28px;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: var(--muted);
      transition: background-color 0.12s, color 0.12s;
    }
    .icon-btn:hover:not(:disabled) { background: var(--hover); color: var(--text); }
    .icon-btn:active:not(:disabled), .icon-btn.open { background: var(--press); color: var(--text); }
    .icon-btn:disabled { opacity: 0.35; }
    .icon-btn svg { width: 16px; height: 16px; }

    .divider { width: 1px; height: 16px; background: var(--line); margin: 0 6px; }

    .title {
      flex: 1 1 auto;
      min-width: 0;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      color: var(--muted);
      padding-left: 4px;
      transition: color 0.15s;
    }

    .pill {
      display: flex;
      align-items: center;
      gap: 7px;
      height: 26px;
      padding: 0 10px 0 12px;
      margin-right: 2px;
      border-radius: 999px;
      border: 1px solid var(--ok-line);
      background: var(--ok-bg);
      color: var(--text);
      transition: filter 0.12s, border-color 0.12s;
    }
    .pill:hover { filter: brightness(1.12); }
    .pill .label { color: var(--muted); }
    .pill .url { font-weight: 600; font-variant-numeric: tabular-nums; }
    .pill svg { width: 13px; height: 13px; color: var(--muted); }
    .pill.copied .url { color: var(--ok); }
    .pill.offline { border-color: var(--warn-line); background: var(--warn-bg); }
    .pill[hidden] { display: none; }

    /* App buttons (theme, notifications, account), shown while a teacher is signed in. */
    .app-actions { display: flex; align-items: center; gap: 2px; margin: 0 2px 0 4px; }
    .app-actions[hidden] { display: none; }
    .badge-wrap { position: relative; }
    .badge {
      position: absolute;
      top: 1px;
      right: 1px;
      min-width: 15px;
      height: 15px;
      padding: 0 4px;
      border-radius: 999px;
      background: var(--danger);
      color: #fff;
      font-size: 9.5px;
      font-weight: 700;
      line-height: 15px;
      text-align: center;
      pointer-events: none;
    }
    .badge[hidden] { display: none; }
    .avatar-btn {
      height: 28px;
      padding: 0 4px;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 6px;
      background: transparent;
    }
    .avatar-btn:hover { background: var(--hover); }
    .avatar-btn:active { background: var(--press); }
    .avatar {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, var(--brand), #e8a308);
      color: #fff;
      font-size: 9.5px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }
    .theme-light-icon, [data-theme="light"] .theme-dark-icon { display: none; }
    [data-theme="light"] .theme-light-icon { display: block; }

    .progress {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 2px;
      overflow: hidden;
      opacity: 0;
      transition: opacity 0.25s;
    }
    .progress::after {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: 35%;
      background: linear-gradient(90deg, transparent, var(--brand), transparent);
      animation: slide 1.1s ease-in-out infinite;
    }
    .loading .progress { opacity: 1; }
    @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(300%); } }

    .blurred .brand, .blurred .title, .blurred .icon-btn { opacity: 0.55; }

    @media (max-width: 1000px) { .pill .label { display: none; } }
    @media (max-width: 760px) { .title { display: none; } }

    /* Splash, visible below the bar until the app view is attached. */
    .splash {
      position: fixed;
      inset: var(--h) 0 0 0;
      display: grid;
      place-content: center;
      justify-items: center;
      gap: 14px;
      background:
        radial-gradient(60% 50% at 50% 38%, rgba(0, 158, 226, 0.12), transparent 70%),
        var(--bg);
      transition: opacity 0.3s;
    }
    .splash img { width: 64px; height: 64px; animation: float 3s ease-in-out infinite; }
    .splash .name { font-size: 22px; font-weight: 600; letter-spacing: 0.01em; }
    .splash .status { color: var(--muted); font-size: 13px; }
    .splash .track { width: 160px; height: 3px; border-radius: 3px; background: var(--line); overflow: hidden; position: relative; margin-top: 4px; }
    .splash .track::after {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: 40%;
      border-radius: 3px;
      background: var(--brand);
      animation: slide 1.1s ease-in-out infinite;
    }
    .app-ready .splash { opacity: 0; pointer-events: none; }
    @keyframes float { 50% { transform: translateY(-4px); } }

  </style>
</head>
<body>
  <div class="bar-bg"></div>
  <header class="bar" id="bar">
    <div class="brand" title="LiveClass"><img src="icon.png" alt="LiveClass" /></div>
    <div class="divider"></div>
    <button class="icon-btn" id="back" title="Back (Alt+Left)" aria-label="Back" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6" /></svg>
    </button>
    <button class="icon-btn" id="forward" title="Forward (Alt+Right)" aria-label="Forward" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6" /></svg>
    </button>
    <div class="title" id="title"></div>
    <button class="pill" id="address" hidden>
      <span class="label" id="address-label">Students join at</span>
      <span class="url" id="address-url"></span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" /><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" /></svg>
    </button>
    <div class="app-actions" id="app-actions" hidden>
      <button class="icon-btn" id="theme" title="Switch to light mode" aria-label="Switch theme">
        <svg class="theme-dark-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41" /></svg>
        <svg class="theme-light-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z" /></svg>
      </button>
      <div class="badge-wrap">
        <button class="icon-btn" id="bell" title="Notifications" aria-label="Notifications">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9" /><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0" /></svg>
        </button>
        <span class="badge" id="badge" hidden></span>
      </div>
      <button class="avatar-btn" id="account" aria-label="Account">
        <span class="avatar" id="avatar"></span>
      </button>
    </div>
    <button class="icon-btn" id="menu" title="Menu" aria-label="Menu" aria-haspopup="menu" aria-expanded="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="1" /><circle cx="19" cy="12" r="1" /><circle cx="5" cy="12" r="1" /></svg>
    </button>
    <div class="progress"></div>
  </header>

  <main class="splash">
    <img src="icon.png" alt="" />
    <div class="name">LiveClass</div>
    <div class="status">Starting your classroom…</div>
    <div class="track"></div>
  </main>

  <script src="titlebar.js"></script>
</body>
</html>
